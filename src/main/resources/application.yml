spring:
  application:
    name: banking-api-gateway
  main:
    web-application-type: reactive
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    gateway:
      server:
        webflux:
          forwarded:
            enabled: false
          x-forwarded:
            enabled: false
          discovery:
            locator:
              enabled: false
          metrics:
            enabled: true
            path-tags:
              enabled: false
      httpclient:
        connect-timeout: 3000
        response-timeout: 6s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${gateway.security.issuer-uri}  

gateway:
  security:
    issuer-uri: ${GATEWAY_SECURITY_ISSUER_URI}
    audience: ${GATEWAY_SECURITY_AUDIENCE}
    jwk-set-uri: ${GATEWAY_SECURITY_JWK_SET_URI:}
  redis:
    uri: ${GATEWAY_REDIS_URI}
  cors:
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:}
    
server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
  max-http-request-header-size: 8KB

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        "[spring.cloud.gateway.requests]": true

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 8
        failureRateThreshold: 50
        slowCallDurationThreshold: 2s
        slowCallRateThreshold: 80
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: false
    instances:
      ledger:
        baseConfig: default
        slowCallDurationThreshold: 2s
      customer:
        baseConfig: default
        slowCallDurationThreshold: 4s
      operations:
        baseConfig: default
        slowCallDurationThreshold: 4s