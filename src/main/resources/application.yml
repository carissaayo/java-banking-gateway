spring:
  application:
    name: banking-api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
      httpclient:
        connect-timeout: 3000
        response-timeout: 6s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${gateway.security.issuer-uri}  

gateway:
  security:
    issuer-uri: ${GATEWAY_SECURITY_ISSUER_URI}
    audience: ${GATEWAY_SECURITY_AUDIENCE}
  redis:
    uri: ${GATEWAY_REDIS_URI}
    
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
