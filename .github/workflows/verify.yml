name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven verify
        run: chmod +x mvnw && ./mvnw -B verify
      - name: Docker image
        run: docker build -t banking-api-gateway:ci .
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: banking-api-gateway:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
