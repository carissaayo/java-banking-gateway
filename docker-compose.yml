services:
  mock-ledger:
    image: wiremock/wiremock:3.13.2
    ports:
      - "8081:8080"
    volumes:
      - ./local/wiremock/ledger:/home/wiremock
    command: ["--disable-banner"]

  mock-customer:
    image: wiremock/wiremock:3.13.2
    ports:
      - "8082:8080"
    volumes:
      - ./local/wiremock/customer:/home/wiremock
    command: ["--disable-banner"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    command:
      - start-dev
      - --import-realm
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://127.0.0.1:8180
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
    volumes:
      - ./local/keycloak:/opt/keycloak/data/import:ro

  redis:
    image: redis:7.4-alpine
    ports:
    - "6379:6379"